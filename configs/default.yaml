providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 1.5   # 1.5 s — short enough to complete OPEN→CLOSED cycles in 100-req simulation
  success_threshold: 1
cache:
  enabled: true
  backend: redis          # "memory" (default) or "redis" (requires docker compose up -d)
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"
load_test:
  requests: 100
  concurrency: 10            # ThreadPoolExecutor workers — enables concurrent load testing

# Chaos scenarios: each overrides provider fail_rate for targeted testing.
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% — all traffic must fallback to backup; circuit opens immediately"
    provider_overrides:
      primary: 1.0
    cache_enabled: false       # disable cache so every request hits providers (proves circuit breaker, not cache)

  - name: primary_flaky_50
    description: "Primary fails 50% — circuit oscillates CLOSED→OPEN→HALF_OPEN→CLOSED; recovery time measured"
    provider_overrides:
      primary: 0.5
    cache_enabled: false       # disable cache so provider calls drive circuit state transitions

  - name: all_healthy
    description: "Baseline — both providers healthy; cache active; high availability expected"
    provider_overrides: {}

  - name: cache_stale_candidate
    description: "Both providers healthy; repeated queries exercise cache hits and guardrail logic"
    provider_overrides: {}
